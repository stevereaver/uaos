# grub.cfg — Ultimate Amiga OS GRUB2 Multiboot2 Configuration
#
# Loaded by GRUB from the ISO /boot/grub/grub.cfg path.
# Targets multiboot2 protocol for direct bare-metal ELF kernel loading.

# -------------------------------------------------------------------------
# Global display settings
# -------------------------------------------------------------------------

insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_output serial
terminal_input  serial

insmod all_video
insmod gfxterm

if [ "${grub_platform}" = "efi" ]; then
    set gfxmode=1024x768x32,800x600x32,auto
    set gfxpayload=keep
else
    insmod vbe
    insmod vga
    set gfxmode=1024x768x32,800x600x32,auto
    set gfxpayload=keep
fi

insmod png
terminal_output gfxterm serial
terminal_input  console serial

# -------------------------------------------------------------------------
# Boot menu appearance
# -------------------------------------------------------------------------

set menu_color_normal=white/black
set menu_color_highlight=black/white
set timeout=5
set default=0

# -------------------------------------------------------------------------
# Menu entries
# -------------------------------------------------------------------------

menuentry "Ultimate Amiga OS (UAOS) — Normal Boot" {
    insmod multiboot2
    echo "Loading UAOS kernel..."
    multiboot2 /boot/uaos-kernel.bin sysroot=/boot/uaos-sysroot.img config=/boot/kickstart.conf loglevel=info vga=0x0318
    echo "Loading sysroot module..."
    module2 /boot/uaos-sysroot.img uaos-sysroot
    module2 /boot/kickstart.conf kickstart-conf
    echo "Booting..."
    boot
}

menuentry "Ultimate Amiga OS (UAOS) — Debug Mode" {
    insmod multiboot2
    echo "Loading UAOS kernel (debug)..."
    multiboot2 /boot/uaos-kernel.bin sysroot=/boot/uaos-sysroot.img config=/boot/kickstart.conf loglevel=debug thunk_trace=yes thunk_reg_dump=yes vga=0x0318
    module2 /boot/uaos-sysroot.img uaos-sysroot
    module2 /boot/kickstart.conf kickstart-conf
    boot
}

menuentry "Ultimate Amiga OS (UAOS) — Serial Console" {
    insmod multiboot2
    serial --unit=0 --speed=115200
    terminal_input  serial
    terminal_output serial
    multiboot2 /boot/uaos-kernel.bin sysroot=/boot/uaos-sysroot.img config=/boot/kickstart.conf loglevel=debug console=ttyS0,115200
    module2 /boot/uaos-sysroot.img uaos-sysroot
    module2 /boot/kickstart.conf kickstart-conf
    boot
}

menuentry "Boot from first hard disk" {
    insmod chain
    chainloader +1
}
