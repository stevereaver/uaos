# aros_kickstart.conf — UAOS AROS Replacement ROM Configuration
#
# Controls which AROS ROM image is loaded into the M68k guest address space
# and which exec vectors are intercepted by the UAOS thunk layer.
#
# Syntax:
#   key = value          single value
#   key = val1, val2     comma-separated list
#   # line comment

# -------------------------------------------------------------------------
# ROM image selection
# -------------------------------------------------------------------------

# Path to the AROS m68k replacement ROM binary (relative to sys-root/).
# AROS ROM images are available from the AROS distribution or built from
# the AROS SVN repository targeting the amiga-m68k toolchain.
rom_image       = SYS/aros-amiga-m68k-rom.bin

# ROM base address in the Amiga address map (standard Kickstart location)
rom_base        = 0x00F80000

# ROM size in bytes (512 KB standard Kickstart / 1 MB extended)
rom_size        = 0x00080000

# -------------------------------------------------------------------------
# Exec library thunk intercept list
#
# List the Exec jump table function names that UAOS replaces with native
# x86_64 implementations via the thunk handler.  Any function NOT listed
# here falls through to the AROS ROM implementation.
# -------------------------------------------------------------------------

intercept_funcs = OpenLibrary,  \
                  CloseLibrary, \
                  AllocMem,     \
                  FreeMem,      \
                  FindTask,     \
                  AddTask,      \
                  RemTask,      \
                  Wait,         \
                  Signal,       \
                  SetFunction

# -------------------------------------------------------------------------
# Memory layout
# -------------------------------------------------------------------------

# Chip RAM size (bytes) — mapped at 0x00000000
chip_ram_size   = 0x00200000    # 2 MB

# Fast RAM base address and size
fast_ram_base   = 0x00200000
fast_ram_size   = 0x07E00000    # 126 MB (fills to 128 MB boundary)

# Slow RAM / Ranger RAM (0x00C00000–0x00DFFFFF) is handled by the MMU
# sandbox as hardware-register space; do not allocate RAM here.

# -------------------------------------------------------------------------
# Custom chip emulation
# -------------------------------------------------------------------------

# Enable partial custom chip register emulation (OCS/ECS/AGA subset)
chipset_emulation = yes

# Blitter, Copper, Sprite register emulation
blitter_enable  = yes
copper_enable   = yes
sprites_enable  = yes

# -------------------------------------------------------------------------
# Debug / trace options
# -------------------------------------------------------------------------

# Log every thunk intercept to stderr
thunk_trace     = yes

# Dump register state on each thunk entry
thunk_reg_dump  = no

# Break into debugger on unhandled ILLEGAL opcodes
break_on_illegal = yes
